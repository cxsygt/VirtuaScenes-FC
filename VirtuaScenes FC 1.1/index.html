<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>足球策略对战游戏</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <!-- 菜单屏幕容器 -->
        <div id="menuScreen" class="screen"></div>

        <!-- 比赛界面（默认隐藏） -->
        <div id="matchScreen" class="screen hidden">
            <!-- 顶部状态栏 -->
            <div id="topbar">
                <button class="back-btn-small" onclick="Menu.showHome()" title="返回主菜单">← 菜单</button>
                <div class="score-board">
                    <span class="team-home" id="homeName">主队</span>
                    <span class="score" id="scoreDisplay">0 : 0</span>
                    <span class="team-away" id="awayName">客队</span>
                </div>
                <div class="round-info">
                    <span id="halfDisplay">上半场</span> |
                    <span id="roundDisplay">第1回合</span> |
                    <span id="possessionDisplay">控球：主队</span>
                </div>
                <div class="ap-info">
                    <span id="currentTeamName">主队</span> 行动点:
                    <div class="ap-bar" id="apBar"></div>
                    <span id="apText">0/12</span>
                </div>
            </div>

            <!-- 主区域 -->
            <div id="main">
                <!-- 左侧：球场 -->
                <div id="fieldContainer">
                    <canvas id="fieldCanvas"></canvas>
                    <div id="fieldHint" class="hint">点击球员选择 | 再次点击查看属性 | 右键取消</div>
                </div>

                <!-- 右侧：信息面板 -->
                <div id="sidebar">
                    <!-- 球员属性卡片 -->
                    <div id="playerCard" class="panel hidden">
                        <div class="panel-header">
                            <span id="cardTitle">球员信息</span>
                            <button class="btn-close" onclick="UI.closeCard()">×</button>
                        </div>
                        <div class="panel-body" id="cardBody"></div>
                        <div class="panel-actions" id="cardActions"></div>
                    </div>

                    <!-- 球员列表 -->
                    <div id="playerList" class="panel">
                        <div class="panel-header">
                            <span id="listTitle">主队阵容</span>
                            <button class="btn-small" onclick="UI.toggleSide()">查看对方</button>
                        </div>
                        <div class="panel-body">
                            <table id="playerTable"></table>
                        </div>
                    </div>

                    <!-- 行动日志 -->
                    <div id="actionLog" class="panel">
                        <div class="panel-header">
                            <span>比赛日志</span>
                            <button class="btn-small" onclick="UI.clearLog()">清空</button>
                        </div>
                        <div class="panel-body" id="logBody"></div>
                    </div>
                </div>
            </div>

            <!-- 底部菜单 -->
            <div id="bottomBar">
                <button class="btn" onclick="UI.endTurn()">结束回合</button>
                <button class="btn" onclick="UI.showHelp()">操作帮助</button>
                <button class="btn btn-danger" onclick="Menu.showHome()">退出比赛</button>
            </div>

            <!-- 模态框 -->
            <div id="modal" class="modal hidden" onclick="UI.closeModal(event)">
                <div class="modal-content" id="modalContent"></div>
            </div>
        </div>
    </div>

    <!-- 脚本加载顺序：工具 → 数据 → 逻辑 → UI -->
    <script src="storage.js?v=10"></script>
    <script src="playerlib.js?v=10"></script>
    <script src="game.js?v=10"></script>
    <script src="ui.js?v=10"></script>
    <script src="menu.js?v=10"></script>
    <script>
        window.onload = () => {
            Menu.init();
        };
    </script>
</body>
</html>
